name: Qualité

# Contrôles en jobs parallèles nommés : un échec doit dire immédiatement quoi
# est cassé, sans dérouler un journal.
#
# Ces mêmes commandes sont appelées par `deploy-worker.yml` et par
# `npm run quality` en local. Aucun `if` de YAML ne peut donc faire diverger ce
# que le CI refuse de ce que le déploiement accepte.
#
# Pas de typecheck ni de lint : la page est un fichier statique sans dépendance
# d'exécution, ces contrôles ne vérifieraient rien.
#
# En revanche `npm ci` est nécessaire là où les tests touchent au générateur de
# QR code, qui dépend du paquet `qrcode`. Le job `page` s'en passe : il porte le
# contrôle du bloc des salles, celui qu'on relance le 14 au matin, debout dans
# un hall — il reste sans installation, donc rapide.

on:
  push:
    branches: [dev, prod]
  pull_request:
    branches: [dev, prod]
  workflow_dispatch: {}

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  page:
    name: Page — bloc des salles et autonomie réseau
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm run check

  scripts:
    name: Tests — scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      # Requis par les tests du générateur de QR code (paquet `qrcode`).
      - run: npm ci
      # Le YAML orchestre, il ne décide pas : la porte qualité, le contrôle
      # après déploiement et le générateur de QR sont des scripts, et ces
      # scripts sont testés.
      - run: npm test
